name: DaniChat release

on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign with secrets from the protected release environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unsigned:
    runs-on: ubuntu-24.04
    env:
      DANICHAT_SUPABASE_URL: ${{ vars.DANICHAT_SUPABASE_URL }}
      DANICHAT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DANICHAT_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install pinned SDK
        run: |
          python3 tools/danichat/install_sdk.py --sdk-root "$RUNNER_TEMP/danichat-sdk" --accept-license
          echo "ANDROID_HOME=$RUNNER_TEMP/danichat-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/danichat-sdk" >> "$GITHUB_ENV"
      - name: Verify and build release
        env:
          DANICHAT_RELEASE_CERT_SHA256: ${{ vars.DANICHAT_RELEASE_CERT_SHA256 }}
        run: |
          tools/arti-build/verify-checksums.sh
          python3 tools/danichat/test_profile_rls.py
          ./gradlew :data:account:testDebugUnitTest :feature:account:testDebugUnitTest :data:account:lintDebug :feature:account:lintDebug :app:testDebugUnitTest :app:lintDebug :feature:welcome:lintDebug :app:assembleRelease --no-daemon --max-workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DaniChat-release-unsigned
          path: app/build/outputs/apk/release/app-universal-release-unsigned.apk
          if-no-files-found: error

  sign:
    if: inputs.sign_release && github.ref == 'refs/heads/main'
    needs: unsigned
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - name: Install pinned SDK
        run: python3 tools/danichat/install_sdk.py --sdk-root "$RUNNER_TEMP/danichat-sdk" --accept-license
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DaniChat-release-unsigned
          path: unsigned
      - name: Sign and verify
        env:
          DANICHAT_KEYSTORE_BASE64: ${{ secrets.DANICHAT_KEYSTORE_BASE64 }}
          DANICHAT_KEY_ALIAS: ${{ secrets.DANICHAT_KEY_ALIAS }}
          DANICHAT_STORE_PASSWORD: ${{ secrets.DANICHAT_STORE_PASSWORD }}
          DANICHAT_KEY_PASSWORD: ${{ secrets.DANICHAT_KEY_PASSWORD }}
          DANICHAT_RELEASE_CERT_SHA256: ${{ vars.DANICHAT_RELEASE_CERT_SHA256 }}
          DANICHAT_SDK_ROOT: ${{ runner.temp }}/danichat-sdk
        run: tools/danichat/sign-release.sh unsigned/app-universal-release-unsigned.apk signed/DaniChat-release.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DaniChat-release-signed
          path: signed/
          if-no-files-found: error
