name: DaniChat Android

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-24.04
    env:
      DANICHAT_SUPABASE_URL: ${{ vars.DANICHAT_SUPABASE_URL }}
      DANICHAT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DANICHAT_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install pinned Android SDK
        run: |
          python3 tools/danichat/install_sdk.py --sdk-root "$RUNNER_TEMP/danichat-sdk" --accept-license
          echo "ANDROID_HOME=$RUNNER_TEMP/danichat-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/danichat-sdk" >> "$GITHUB_ENV"
      - name: Verify native inputs
        run: tools/arti-build/verify-checksums.sh
      - name: Test host tooling
        run: python3 -m unittest discover -s tools/release_gate -p 'test_*.py'
      - name: Test profile access control in disposable PostgreSQL
        run: python3 tools/danichat/test_profile_rls.py
      - name: Unit tests, lint and debug APK
        run: ./gradlew :data:account:testDebugUnitTest :feature:account:testDebugUnitTest :data:account:lintDebug :feature:account:lintDebug :app:testDebugUnitTest :app:lintDebug :feature:welcome:lintDebug :app:assembleDebug --no-daemon --max-workers=2
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DaniChat-debug
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
      - name: Summarize unit test results
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for module in ('app', 'data/account', 'feature/account'):
              reports = list(pathlib.Path(module, 'build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
              if not reports:
                  print(f'{module}: no completed test reports')
                  continue
              totals = {key: 0 for key in ('tests', 'failures', 'errors')}
              for report in reports:
                  root = ET.parse(report).getroot()
                  for key in totals:
                      totals[key] += int(root.attrib.get(key, 0))
              print(f'{module}: {totals}')
          PY
