name: DaniChat Android

on:
  workflow_dispatch:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21.0.11+10.0.LTS'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install pinned Android SDK
        run: |
          python3 tools/danichat/install_sdk.py --sdk-root "$RUNNER_TEMP/danichat-sdk" --accept-license
          echo "ANDROID_HOME=$RUNNER_TEMP/danichat-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/danichat-sdk" >> "$GITHUB_ENV"
      - name: Verify native inputs
        run: tools/arti-build/verify-checksums.sh
      - name: Test host tooling
        run: python3 -m unittest discover -s tools/release_gate -p 'test_*.py'
      - name: Unit tests, lint and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :feature:welcome:lintDebug :app:assembleDebug --no-daemon --max-workers=2
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DaniChat-debug
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DaniChat-verification
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            feature/welcome/build/reports/lint-results-*.html
